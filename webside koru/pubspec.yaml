name: koru_website
description: "Koru Hospital Transport - patient transport website built with Flutter Web."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  cloud_firestore: ^7.1.0
  # Hashes the booking reference + tracking code into the tracking id.
  crypto: ^3.0.6
  firebase_auth: ^7.0.1
  firebase_core: ^5.1.0
  flutter:
    sdk: flutter
  # Turkish/English texts for built-in widgets (date picker, time picker).
  flutter_localizations:
    sdk: flutter
  # Manrope font from Google Fonts.
  flutter_map: ^8.3.2
  # Driver's location, shared with the patient while driving.
  geolocator: ^14.1.2
  google_fonts: ^6.2.1
  # Opens phone calls, WhatsApp, email and map links.
  latlong2: ^0.10.1
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
